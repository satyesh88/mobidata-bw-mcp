# Example only. Replace <DOMAIN> with your host name and adjust the certificate paths.
# Add this as a NEW file (for example sites-available/<DOMAIN>.conf); do not edit other sites.
# Test with `nginx -t`, then `nginx -s reload` (a reload does not drop existing connections).

server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;

    client_max_body_size 1m;

    location = /health {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }

    # Streamable HTTP can answer with a server-sent event stream: no buffering.
    location /mcp {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
