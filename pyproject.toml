[project]
name = "mobidata-bw-mcp"
version = "0.1.0"
description = "MCP server for live mobility data from MobiData BW"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Satyesh Shivam" },
]
dependencies = [
  "cachetools>=5.5,<7",
  "defusedxml>=0.7.1",
  "httpx>=0.28,<1",
  "mcp>=1.20,<2",
  "pydantic>=2.10,<3",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
telegram = [
  "anthropic>=0.75,<1",
  "python-dotenv>=1.1,<2",
  "python-telegram-bot[job-queue]>=21,<23",
]

[project.scripts]
mobidata-bw-mcp = "mobidata_bw_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mobidata_bw_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
